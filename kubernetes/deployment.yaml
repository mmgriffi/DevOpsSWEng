apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-app
  namespace: dev
  labels:
    app: devops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-app
  template:
    metadata:
      labels:
        app: devops-app
    spec:
      containers:
        - name: devops-app
          image: ghcr.io/mmgriffi/devops:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
      # Uncomment the lines below if your GHCR package is set to Private
      imagePullSecrets:
       - name: ghcr-secret-devops
