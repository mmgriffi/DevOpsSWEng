apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-app-ingress
  namespace: {{ENV}}
spec:
  ingressClassName: nginx
  rules:
    - host: devops-{{ENV}}.cluen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: devops-app-service
                port:
                  number: 80
