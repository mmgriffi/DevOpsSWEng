name: CI_Pipeline_Steps
permissions:
  contents: write
  packages: write
on:
  workflow_dispatch:

jobs:
  Build_and_Test:
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Build Docker image
#        run: docker build -t devops-app:test .
        run: |
          APP_VERSION=$(git describe --tags --abbrev=0 || echo "dev")
          BUILD_DATE=$(date +"%d-%b-%Y")
          echo "Building version: $APP_VERSION"
          docker build --build-arg APP_VERSION=$APP_VERSION \
          --build-arg BUILD_DATE=$BUILD_DATE \
          -t devops-app:test .

      - name: Run Django unit tests with coverage
        run: |
          docker run --name tennis-unit-tests \
#fix issue with coverage report - this was being run in /app/my_tennis_club, but later SonarQube tries to read the report from /app
#resuling in incorrect coverage issues.
            -w /app \
            devops-app:test \
            sh -c "pip install coverage && coverage run --rcfile=my_tennis_club/.coveragerc --source=my_tennis_club my_tennis_club/manage.py test my_tennis_club -v 2 && coverage xml"

          docker cp tennis-unit-tests:/app/coverage.xml ./coverage.xml
          docker rm tennis-unit-tests

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: Start Django container
        run: |
          docker run -d \
            --name tennis-app \
            -p 8000:8000 \
            devops-app:test

      - name: Wait for Django
        run: sleep 15

      - name: Run Playwright tests
        run: pytest my_tennis_club/E2ETests -v

      - name: Remove Docker container
        if: always()
        run: docker rm -f tennis-app || true

      - name: Upload screenshots as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: |
            *.png
            test-results/
          retention-days: 30

  QualityScan:
    needs: Build_and_Test
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.sources=my_tennis_club
            -Dsonar.tests=my_tennis_club
            -Dsonar.test.inclusions=**/tests.py,**/test_*.py,**/E2ETests/**
            -Dsonar.exclusions=**/migrations/**,**/settings.py,**/manage.py,**/asgi.py,**/wsgi.py
            -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: Quality Gate Check
        continue-on-error: true
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  Push_To_GHCR:
    needs: QualityScan
    runs-on: [ self-hosted ]
    steps:
      - name: Rename to deploy
        run: |
          docker tag devops-app:test devops-app:deploy
          docker rmi devops-app:test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker tag devops-app:deploy ghcr.io/mmgriffi/devops:latest 
          docker push ghcr.io/mmgriffi/devops:latest
          docker rmi devops-app:deploy || true

  deploy-to-dev:
    needs: Push_To_GHCR
    uses: ./.github/workflows/CD_workflow.yaml
    with:
      env: 'dev'
    secrets: inherit
