name: CI_Pipeline_Steps
permissions:
   contents: write
   packages: write
on:
  workflow_dispatch:
jobs:
  Build_and_Test:
    runs-on: [ self-hosted ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for SonarQube blame/new-code data

      - name: Build Docker image
        run: docker build -t devops-app:test .

      - name: Run Django unit tests with coverage
        run: |
          docker run --name tennis-unit-tests \
            -w /app/my_tennis_club \
            devops-app:test \
            sh -c "pip install coverage && coverage run manage.py test && coverage xml"

          # Copy coverage.xml to the runner workspace for SonarQube, then clean up container
          docker cp tennis-unit-tests:/app/my_tennis_club/coverage.xml ./coverage.xml
          docker rm tennis-unit-tests

      - name: Start Django container
        run: |
          docker run -d \
            --name tennis-app \
            -p 8000:8000 \
            devops-app:test

      - name: Wait for Django
        run: |
          sleep 15

      # Execute the playwright tests on the runner itself against the docker container
      - name: Run Playwright tests
        run: |
          pytest my_tennis_club/E2ETests -v

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml

      - name: Quality Gate Check
        # Set to 'true' initially so existing alerts don't block builds; change to 'false' once ready to enforce
        continue-on-error: true
        uses: sonarsource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Rename to deploy
        run: |
          docker tag devops-app:test devops-app:deploy
          docker rmi devops-app:test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker tag devops-app:deploy ghcr.io/mmgriffi/devops:latest 
          docker push ghcr.io/mmgriffi/devops:latest
          docker rmi devops-app:deploy || true

      - name: Remove Docker container
        if: always()
        run: |
          docker rm -f tennis-app || true

      - name: Upload screenshots as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: |
            *.png
            test-results/
          retention-days: 30

  deploy-to-dev:
    needs: Build_and_Test
    uses: ./.github/workflows/CD_workflow.yaml
    with:
      env: 'dev'
    secrets: inherit