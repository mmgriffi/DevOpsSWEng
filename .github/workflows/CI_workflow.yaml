name: CI_Pipeline_Steps
permissions:
   contents : read
   packages : write
on:
  workflow_dispatch:
jobs:
  Build_and_Test:
    runs-on: [ self-hosted ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: devops-app:test

      - name: Run Django unit tests
        run: |
          docker run --rm \
            -w /app/my_tennis_club \
            devops-app:test \
            python manage.py test

      - name: Start Django container
        run: |
         docker run -d \
           --name tennis-app \
           -p 8000:8000 \
           devops-app:test

      - name: Wait for Django
        run: |
          pwd
          ls -lart
          sleep 15
# Execute the playwright tests on the runner itself against the docker container.
      - name : Run Playwright tests
        run: |
           pytest my_tennis_club/E2ETests -v
      - name: rename to deploy
        run: |
         #docker rm -f tennis-app
         docker tag devops-app:test devops-app:deploy
         docker rmi devops-app:test
#        leave the image on the sytem for now.
#        docker image rm devops-app:test
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image to GHCR
        run: |
          docker tag devops-app:deploy ghcr.io/mmgriffi/devops:latest 
          docker push ghcr.io/mmgriffi/devops:latest
      - name : Remove Docker container
        if: always()
        run: |
          docker rm -f tennis-app || true
#         docker rmi devops-app:test || true
      - name: Upload screenshots as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: |
            *.png
            test-results/
          retention-days: 30
  deploy-to-dev:
    # Replace 'build-and-test' with the actual job ID from your CI_workflow.yaml
    needs: Build_and_Test
    uses: ./.github/workflows/CD_workflow.yaml
    with:
      env: 'dev'
    # Passes all your repository secrets (like KUBECONFIG or GHCR tokens) to the CD workflow
    secrets: inherit

