name: CD_Pipeline_steps
# for CD steps
permissions:
    contents: write
on:
  pull_request:
    branches: [ main ]

  # Automatically runs when the CI workflow finishes
  workflow_run:
    workflows: ["CI_Pipeline_Steps"] # Must match the exact 'name:' inside CI_workflow.yaml
    types:
      - completed

  workflow_dispatch:
    inputs:
      env:
        description: 'Target Kubernetes environment (namespace)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

jobs:
  Deploy:
    runs-on: [ self-hosted ]
    env:
      TARGET_ENV: ${{ inputs.env || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set kubeconfig path
        run: |
          if [ -f "$HOME/config" ]; then
            echo "KUBECONFIG=$HOME/config" >> $GITHUB_ENV
          elif [ -f "$HOME/.kube/config" ]; then
            echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
          else
            echo "Error: kubeconfig not found in $HOME/config or $HOME/.kube/config"
            exit 1
          fi

      - name: Ensure namespace exists
        run: |
          kubectl create namespace ${{ env.TARGET_ENV }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Replace placeholders and apply Kubernetes manifests
        run: |
          sed -i "s/{{ENV}}/${{ env.TARGET_ENV }}/g" kubernetes/deployment.yaml kubernetes/services.yaml kubernetes/ingress.yaml
          kubectl apply -f kubernetes/deployment.yaml -f kubernetes/services.yaml -f kubernetes/ingress.yaml

      - name: Restart deployment to pull latest image
        run: |
          echo "Deploying to namespace: $TARGET_ENV"
          kubectl rollout restart deployment devops-app -n ${{ env.TARGET_ENV }}
          kubectl rollout status deployment devops-app -n ${{ env.TARGET_ENV }} --timeout=120s
      - name: Wait for Application
        run: |
          pwd
          ls -lart
          sleep 30

#if tests can be used to apply the relevant dev/prod or local url to conftest.py
