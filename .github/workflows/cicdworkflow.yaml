name: CI/CD Pipeline for Club Website

on:
  workflow_dispatch:
  #push:
  #  branches: [ main, dev ]
  #  workflow_dispatch:
  #pull_request:
  #  branches: [ main ]

jobs:
  Build_and_Test:
    runs-on: [ self-hosted ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: devops-app:test

      - name: Run Django unit tests
        run: |
          docker run --rm \
            -w /app/my_tennis_club \
            devops-app:test \
            python manage.py test

      - name: Start Django container
        run: |
         docker run -d \
           --name tennis-app \
           -p 8000:8000 \
           devops-app:test

      - name: Wait for Django
        run: |
          pwd
          cd /home/gh-runner/actions-runner/_work/DevOpsSWEng/DevOpsSWEng/my_tennis_club
          ls -lart
          sleep 15
# Execute the playwright tests on the runner itself against the docker container.
      - name : Run Playwright tests
        run: |
           pytest my_tennis_club/E2ETests -v

      - name: rename to deploy
        if: always()
        run: |
         #docker rm -f tennis-app
         docker tag devops-app:test devops-app:deploy
         docker rmi devops-app:test
#        leave the image on the sytem for now.
#        docker image rm devops-app:test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=main
            # for this co-piot said that a commit with a tag would result in GHCR showing the tag

      - name: Push Docker image to GHCR
        run: |
          docker tag devops-app:deploy ghcr.io/mmgriffi/devops:latest 
          docker push ghcr.io/mmgriffi/devops:latest
      - name : Remove Docker container
        if: always()
        run: |
          docker rm -f tennis-app