name: CI/CD Pipeline for Club Website

on:
  workflow_dispatch:
  #push:
  #  branches: [ main, dev ]
  #  workflow_dispatch:
  #pull_request:
  #  branches: [ main ]

jobs:
  Build_and_Test:
    runs-on: [ self-hosted ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: devops-app:test

      - name: Run Django unit tests
        run: |
          docker run --rm \
            -w /app/my_tennis_club \
            devops-app:test \
            python manage.py test

      - name: Start Django container
        run: |
         docker run -d \
           --name tennis-app \
           -p 8000:8000 \
           devops-app:test

      - name: Wait for Django
        run: |
          sleep 15    

      - name: Run Playwright tests
        run: |
         docker exec \
           -w /app/my_tennis_club \
          tennis-app \
          pytest E2ETests -v

      #- name: Cleanup
      #  if: always()
      #  run: |
      #   docker rm -f tennis-app
